<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Saleor Yard</title>
  <desc id="description">A gantry crane lifting a shipping container marked with the Saleor icon.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a48"/>
      <stop offset="1" stop-color="#191e28"/>
    </linearGradient>
    <linearGradient id="container" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.55" stop-color="#ff6846"/>
      <stop offset="1" stop-color="#ef482f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#080a0f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- The crane stays behind the suspended container. -->
  <g fill="url(#steel)">
    <path d="M142 254h112l-58 584H82z"/>
    <path d="M770 254h112l60 584H828z"/>
  </g>
  <g fill="#ff6846">
    <path d="M166 278h32l-45 536h-28z"/>
    <path d="M826 278h32l43 536h-28z"/>
  </g>
  <g fill="none" stroke="#343a48" stroke-width="22" stroke-linecap="square">
    <path d="m137 394 85 83-102 92 84 83-103 94"/>
    <path d="m887 394-85 83 102 92-84 83 103 94"/>
  </g>

  <!-- Gantry beam and trolley. -->
  <g filter="url(#shadow)">
    <path d="M96 150h832v130H96z" fill="url(#steel)"/>
    <path d="M96 150h832v28H96z" fill="#ff6846"/>
    <path d="M96 252h832v28H96z" fill="#10141c"/>
    <g fill="none" stroke="#454d5d" stroke-width="16">
      <path d="m126 244 78-60 78 60 78-60 78 60 78-60 78 60 78-60 78 60 78-60 78 60"/>
    </g>
    <path d="M420 246h184v92H420z" fill="#252b37"/>
    <path d="M438 316h148v30H438z" fill="#ff6846"/>
    <circle cx="456" cy="270" r="17" fill="#10141c"/>
    <circle cx="568" cy="270" r="17" fill="#10141c"/>
  </g>

  <!-- Hoist cables and spreader. -->
  <g fill="none" stroke="#252b37" stroke-width="11" stroke-linecap="round">
    <path d="M470 338v98M554 338v98"/>
    <path d="m350 464-74 52M674 464l74 52"/>
  </g>
  <path d="M326 426h372v48H326z" fill="#191e28"/>
  <path d="M326 426h372v12H326z" fill="#ff6846"/>
  <path d="M326 446h28v38h-28zM670 446h28v38h-28z" fill="#10141c"/>

  <!-- Suspended shipping container. -->
  <g filter="url(#shadow)">
    <path d="M240 508h544v240H240z" fill="url(#container)" stroke="#191e28" stroke-width="16" stroke-linejoin="round"/>
    <path d="M248 516h528v20H248zM248 720h528v20H248z" fill="#d9432e"/>
    <g fill="#b43128" opacity="0.58">
      <path d="M286 536h18v184h-18zM330 536h18v184h-18zM374 536h18v184h-18z"/>
      <path d="M632 536h18v184h-18zM676 536h18v184h-18zM720 536h18v184h-18z"/>
    </g>
    <g fill="#191e28">
      <path d="M256 524h28v28h-28zM740 524h28v28h-28zM256 704h28v28h-28zM740 704h28v28h-28z"/>
      <path d="M270 486h34v30h-34zM720 486h34v30h-34z"/>
    </g>

    <!-- Exact icon path from the Saleor wordmark, without the text. -->
    <path d="M19.7553 7.98047H5.18348L0 14.0727H14.5719L19.7553 7.98047Z" fill="#191e28" transform="translate(384 585) scale(13) translate(0 -7.98047)"/>
  </g>

  <!-- Crane wheels and rail emphasize that the load is still in the air. -->
  <g fill="#10141c">
    <path d="M66 812h154v40H66zM804 812h154v40H804z"/>
    <circle cx="112" cy="852" r="31"/>
    <circle cx="184" cy="852" r="31"/>
    <circle cx="840" cy="852" r="31"/>
    <circle cx="912" cy="852" r="31"/>
    <path d="M52 878h920v30H52z"/>
  </g>
  <g fill="#ff6846">
    <circle cx="112" cy="852" r="12"/>
    <circle cx="184" cy="852" r="12"/>
    <circle cx="840" cy="852" r="12"/>
    <circle cx="912" cy="852" r="12"/>
  </g>
</svg>
